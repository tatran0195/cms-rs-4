[package]
name = "cms-server"
description = "Axum HTTP server for CMS Documentation Platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
cms-core = { path = "../cms-core" }
cms-db = { path = "../cms-db" }
cms-server-core = { path = "../cms-server-core" }
cms-auth = { path = "../cms-auth" }
cms-authz = { path = "../cms-authz" }
cms-outbox = { path = "../cms-outbox" }
cms-notifications = { path = "../cms-notifications" }
cms-sites = { path = "../cms-sites" }
cms-docs = { path = "../cms-docs" }
axum = { workspace = true }
axum-extra = { version = "0.10", features = ["cookie"] }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
thiserror = { workspace = true }
jsonwebtoken = { version = "9" }

[lints]
workspace = true
